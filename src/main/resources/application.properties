# ============================================================
# SERVER
# ============================================================

server.port=8082
server.servlet.context-path=/timesheet-devops
server.address=0.0.0.0

# Ne jamais renvoyer de stacktrace / message interne au client
server.error.include-stacktrace=never
server.error.include-message=never


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/timesheet?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE  (Hibernate 6 : le dialecte MySQL est détecté automatiquement)
# ============================================================

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO


# ============================================================
# ACTUATOR / MONITORING
# ============================================================

# Exposer uniquement les endpoints nécessaires (pas env, heapdump, beans...)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.base-path=/actuator

# Health : pas de détails pour les visiteurs anonymes + probes Kubernetes
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true


# ============================================================
# PROMETHEUS  (nouveau nom de propriété Spring Boot 3)
# ============================================================

management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=timesheet-devops

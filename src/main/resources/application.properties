# ============================================================
# SERVER
# ============================================================

server.port=8082
server.servlet.context-path=/timesheet-devops
server.address=0.0.0.0


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/timesheet?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect


# ============================================================
# LOGGING
# ============================================================

logging.level.root=INFO


# ============================================================
# ACTUATOR / MONITORING
# ============================================================

management.endpoints.web.exposure.include=*
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoints.web.base-path=/actuator


# ============================================================
# PROMETHEUS
# ============================================================

management.metrics.tags.application=timesheet-devops
